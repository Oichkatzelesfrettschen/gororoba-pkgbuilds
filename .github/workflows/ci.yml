name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PACKAGER: "gororoba-pkgbuilds CI"
jobs:
  scrub-check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
      - name: Scrub tracked files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh scripts/scrub-check.sh

  shellcheck:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git shellcheck
      - uses: actions/checkout@v4
      - name: Shellcheck scripts and recipes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          status=0
          for f in scripts/*.sh; do
            [ -f "$f" ] || continue
            shellcheck -S error -s sh "$f" || status=1
          done
          for f in */PKGBUILD; do
            [ -f "$f" ] || continue
            shellcheck -S error -s bash -e SC2034,SC2154,SC2164 "$f" || status=1
          done
          exit "$status"

  recipes:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      dirs: ${{ steps.changed.outputs.dirs }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List changed recipe directories
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$EVENT" = pull_request ]; then
            base=origin/$BASE_REF
          else
            base=$BEFORE
          fi
          dirs=$(sh scripts/changed-recipes.sh "$base" | tr '\n' ' ' || true)
          printf 'changed: %s\n' "$dirs"
          printf 'dirs=%s\n' "$dirs" >> "$GITHUB_OUTPUT"

  srcinfo-namcap:
    needs: recipes
    if: needs.recipes.outputs.dirs != ''
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git namcap
      - uses: actions/checkout@v4
      - name: Check .SRCINFO and namcap
        env:
          DIRS: ${{ needs.recipes.outputs.dirs }}
        run: |
          status=0
          for d in $DIRS; do
            sh scripts/srcinfo-check.sh "$d" || status=1
            namcap -i "$d/PKGBUILD" || status=1
          done
          exit "$status"

  build:
    needs: recipes
    if: needs.recipes.outputs.dirs != ''
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools and build user
        run: |
          pacman -Syu --noconfirm --needed git sudo
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          install -d -o builder -g builder /var/tmp/build/work /var/tmp/build/src /var/tmp/build/pkg
      - uses: actions/checkout@v4
      - name: Build changed recipes
        env:
          DIRS: ${{ needs.recipes.outputs.dirs }}
        run: |
          chmod -R a+rX "$GITHUB_WORKSPACE"
          status=0
          for d in $DIRS; do
            printf '::group::%s\n' "$d"
            ( cd "$d" && sudo -u builder env \
                PACKAGER="$PACKAGER" BUILDDIR=/var/tmp/build/work \
                SRCDEST=/var/tmp/build/src PKGDEST=/var/tmp/build/pkg \
                makepkg --syncdeps --noconfirm --needed --cleanbuild ) || status=1
            printf '::endgroup::\n'
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: /var/tmp/build/pkg/*.pkg.tar.*
          if-no-files-found: ignore
