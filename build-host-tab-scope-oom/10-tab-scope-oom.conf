# Terminal tab scopes (ptyxis-spawn-*.scope, tmux-spawn-*.scope) hold a shell,
# an agent CLI and whatever the tab starts.
#
# MemorySwapMax keeps a tab below the 5% of total swap that systemd-oomd
# requires of a swap-kill victim (THRESHOLD_SWAP_USED_PERCENT in
# src/oom/oomd-manager.h); systemd.resource-control(5) states that the swap
# kill reads ManagedOOMPreference only on a root-owned cgroup, so the budget
# and not the preference removes a tab from that candidate list. With 63.9 GiB
# of swap the threshold is 3.19 GiB.
#
# ManagedOOMPreference=avoid applies to the memory-pressure kill, which reads
# the attribute when the monitored ancestor (user@UID.service) has the same
# owner as the scope.
#
# MemoryMax bounds a job started inside the tab. The kernel reclaims the
# scope's page cache before it kills, then kills the largest process of the
# scope. OOMPolicy=continue keeps the scope and its other processes alive after
# that kill; the default for a scope stops the whole unit.
#
# A job that needs more runs through bounded-workload(1) or on a compute host.

[Scope]
MemorySwapMax=2G
MemoryMax=16G
ManagedOOMPreference=avoid
OOMPolicy=continue
